# Web SSH：Termix（https://github.com/Termix-SSH/Termix）
# 通过 ./rpctl up webssh 启动，经 Caddy 以 https://$WEBSSH_DOMAIN 访问
name: rp-webssh

services:
  termix:
    image: ${TERMIX_IMAGE:-ghcr.io/termix-ssh/termix:26.11.0}
    container_name: termix
    restart: unless-stopped
    environment:
      PORT: "8080"
      # 容器以 root 启动后降权为 node 用户（UID/GID 如下）
      PUID: "1000"
      PGID: "1000"
      # 只信任 Docker 内网（Caddy 所在网段）传来的 X-Forwarded-For
      TRUSTED_PROXIES: "172.16.0.0/12"
      # 注册接口已在 Caddy 层对公网屏蔽（proxy/sites/webssh.caddy），
      # 这里保持 true，供 ./rpctl webssh add-user 在容器内部创建账号
      ALLOW_REGISTRATION: "true"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 数据库、加密密钥、上传文件 —— 需要备份（./rpctl backup）
      - termix_data:/app/data
    # 让容器能通过 host.docker.internal 连到宿主机自身的 sshd
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy
    # 不映射端口：只能经由 Caddy 访问
    security_opt:
      - no-new-privileges:true

volumes:
  termix_data:

networks:
  proxy:
    name: proxy
    external: true
